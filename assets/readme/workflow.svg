<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">AuditFlow engagement lifecycle</title>
  <desc id="desc">A staged lifecycle from initial data and planning through testing, observations, reporting, feedback, and archive.</desc>
  <rect width="1200" height="380" rx="8" fill="#f8fafc"/>
  <path d="M48 64H1152M48 316H1152" stroke="#d7dee8" stroke-width="1"/>

  <text x="48" y="39" fill="#1f4e79" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">
    ONE ENGAGEMENT / EXPLICIT SOURCE OF TRUTH AT EVERY STAGE
  </text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(48 94)">
      <rect width="315" height="178" rx="6" fill="#ffffff" stroke="#9bb9d4" stroke-width="2"/>
      <rect width="10" height="178" rx="5" fill="#1f4e79"/>
      <text x="34" y="42" fill="#1f4e79" font-size="30" font-weight="700">01 / Plan</text>
      <text x="34" y="79" fill="#475569" font-size="20">initial_data.yml</text>
      <text x="34" y="110" fill="#475569" font-size="20">planning_decision.yml</text>
      <text x="34" y="141" fill="#475569" font-size="20">audit_program.yml</text>
    </g>

    <path d="M376 183H408" stroke="#64748b" stroke-width="3"/>
    <path d="M399 174L410 183L399 192" fill="none" stroke="#64748b" stroke-width="3"/>

    <g transform="translate(428 94)">
      <rect width="315" height="178" rx="6" fill="#ffffff" stroke="#9fca85" stroke-width="2"/>
      <rect width="10" height="178" rx="5" fill="#70ad47"/>
      <text x="34" y="42" fill="#386522" font-size="30" font-weight="700">02 / Execute</text>
      <text x="34" y="79" fill="#475569" font-size="20">evidence + scripts</text>
      <text x="34" y="110" fill="#475569" font-size="20">workpapers</text>
      <text x="34" y="141" fill="#475569" font-size="20">results + conclusions</text>
    </g>

    <path d="M756 183H788" stroke="#64748b" stroke-width="3"/>
    <path d="M779 174L790 183L779 192" fill="none" stroke="#64748b" stroke-width="3"/>

    <g transform="translate(808 94)">
      <rect width="344" height="178" rx="6" fill="#ffffff" stroke="#dfb98f" stroke-width="2"/>
      <rect width="10" height="178" rx="5" fill="#d28a42"/>
      <text x="34" y="42" fill="#8a4d16" font-size="30" font-weight="700">03 / Communicate</text>
      <text x="34" y="79" fill="#475569" font-size="20">observations</text>
      <text x="34" y="110" fill="#475569" font-size="20">report + feedback</text>
      <text x="34" y="141" fill="#475569" font-size="20">archive story</text>
    </g>
  </g>

  <g transform="translate(48 345)" font-family="Consolas, monospace" font-size="16" fill="#64748b">
    <text x="0" y="0">STRUCTURED FACTS</text>
    <text x="335" y="0">REPRODUCIBLE WORK</text>
    <text x="720" y="0">TRACEABLE CONCLUSIONS</text>
    <text x="1015" y="0">PLAIN FILES</text>
  </g>
</svg>
