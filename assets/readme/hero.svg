<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">AuditFlow</title>
  <desc id="desc">A lightweight framework for reproducible, data-driven internal audits, built around clear reasoning, focused testing, and minimal mechanical work.</desc>
  <rect width="1200" height="430" rx="8" fill="#111827"/>
  <path d="M0 76H1200M0 350H1200" stroke="#334155" stroke-width="1"/>
  <path d="M660 0V350" stroke="#1f2937" stroke-width="1"/>

  <text x="58" y="154" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="82" font-weight="750">
    AuditFlow
  </text>
  <text x="60" y="211" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="29">
    lightweight framework for reproducible,
  </text>
  <text x="60" y="249" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="29">
    data-driven internal audits
  </text>

  <g transform="translate(700 42)">
    <text x="0" y="0" fill="#93c5fd" font-family="Consolas, monospace" font-size="16" font-weight="700">PHILOSOPHY</text>
    <text x="0" y="38" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">
      Time is the most valuable thing. So:
    </text>

    <g fill="#93c5fd">
      <circle cx="6" cy="75" r="4"/>
      <circle cx="6" cy="113" r="4"/>
      <circle cx="6" cy="169" r="4"/>
      <circle cx="6" cy="207" r="4"/>
      <circle cx="6" cy="263" r="4"/>
    </g>
    <g fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="19">
      <text x="22" y="81">no work for the sake of work</text>
      <text x="22" y="119">"why?" before "how?": focus testing</text>
      <text x="22" y="143">on significant areas</text>
      <text x="22" y="175">work is easy to understand and trace</text>
      <text x="22" y="213">decisions and conclusions are data-based;</text>
      <text x="22" y="237">analysis is simple and fast</text>
      <text x="22" y="269">minimum mechanical work</text>
    </g>
  </g>

  <g transform="translate(58 389)" font-family="Consolas, monospace" font-size="16">
    <path d="M38 -9H974" stroke="#475569" stroke-width="2"/>
    <g fill="#93c5fd">
      <circle cx="38" cy="-9" r="7"/>
      <circle cx="185" cy="-9" r="7"/>
      <circle cx="316" cy="-9" r="7"/>
      <circle cx="454" cy="-9" r="7"/>
      <circle cx="602" cy="-9" r="7"/>
      <circle cx="760" cy="-9" r="7"/>
      <circle cx="914" cy="-9" r="7"/>
    </g>
    <text x="0" y="28" fill="#cbd5e1">RISK</text>
    <text x="145" y="28" fill="#cbd5e1">CONTROL</text>
    <text x="288" y="28" fill="#cbd5e1">TEST</text>
    <text x="414" y="28" fill="#cbd5e1">EVIDENCE</text>
    <text x="574" y="28" fill="#cbd5e1">RESULT</text>
    <text x="700" y="28" fill="#cbd5e1">OBSERVATION</text>
    <text x="886" y="28" fill="#cbd5e1">REPORT</text>
  </g>

  <text x="1064" y="402" fill="#64748b" font-family="Consolas, monospace" font-size="14">PY 3.11+ / MIT</text>
</svg>
