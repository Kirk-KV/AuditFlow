[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditflow"
dynamic = ["version"]
description = "A VSCode-based framework for reproducible, data-driven internal audits."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
    {name = "Kirill"}
]
keywords = [
    "internal-audit",
    "audit",
    "data-analysis",
    "quarto",
    "reproducibility"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial"
]
dependencies = [
    "httpx>=0.27.0",
    "jsonschema>=4.0.0",
    "markdown-it-py>=3.0.0",
    "typer>=0.12.0",
    "pyyaml>=6.0.0"
]

[project.optional-dependencies]
analysis = [
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "jupyter>=1.1.0"
]
test = [
    "pandas>=2.2.0",
    "pytest>=8.0.0"
]

[project.scripts]
auditflow = "auditflow.cli:main"

[project.urls]
Homepage = "https://github.com/Kirk-KV/auditflow"
Repository = "https://github.com/Kirk-KV/auditflow"
Issues = "https://github.com/Kirk-KV/auditflow/issues"
Changelog = "https://github.com/Kirk-KV/auditflow/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["auditflow*"]
exclude = ["docs*", "examples*", "schemas*", "styles*", "tests*"]

[tool.setuptools.dynamic]
version = {attr = "auditflow.__version__"}

[tool.setuptools.package-data]
auditflow = [
    "schemas/*.json",
    "templates/*.yml",
    "templates/*.qmd",
    "templates/*.md",
    "templates/*.txt",
    "templates/*.css",
    "templates/.gitignore",
    "templates/ai/*.md",
    "templates/styles/*.css",
    "templates/styles/*.yml",
    "templates/.vscode/*.json",
    "templates/en/*.yml",
    "templates/en/*.qmd",
    "templates/en/*.md",
    "templates/en/*.txt",
    "templates/ru/*.yml",
    "templates/ru/*.qmd",
    "templates/ru/*.md",
    "templates/ru/*.txt"
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
# Quarto rendering dominates the run time, so the default suite is the fast one.
# Use `python -m pytest -m integration` (or `-m ""`) to include it.
addopts = "-m 'not integration'"
markers = [
    "integration: checks external tools such as Quarto when they are available"
]
