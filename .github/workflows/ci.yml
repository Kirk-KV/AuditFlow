name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock

      - name: Install AuditFlow
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements-dev.lock -e ".[analysis,test]"

      - name: Compile package
        run: python -m compileall -q auditflow

      - name: Run unit tests
        run: python -m pytest -q -m "not integration"

      - name: Validate synthetic audit
        run: |
          python -m auditflow validate --project examples/procurement_audit
          python -m auditflow evidence status --project examples/procurement_audit

      - name: Build wheel
        if: matrix.python-version == '3.11'
        run: python -m pip wheel . --no-deps --wheel-dir dist

  quarto:
    name: Quarto 1.8.27
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock

      - name: Install AuditFlow
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements-dev.lock -e ".[analysis,test]"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.27

      - name: Render synthetic audit
        run: python -m pytest -q -m integration
