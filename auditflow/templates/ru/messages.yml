feedback:
  audit_default: Аудит
  request_subject: "Запрос обратной связи: {audit_name}"
  requested_response_date: "Просим ответить до: {date}"
  score: Оценка
  comment: Комментарий
  answer: Ответ
  "yes": Да
  "no": Нет
  received: Получен
  received_inferred: Получен (определено автоматически)
  not_received: Не получен
  no_validation_notes: _Замечаний по заполнению нет._
  inferred_note: >-
    {name}: ответ считается полученным, поскольку в шаблоне заполнены оценки или
    комментарии, хотя `response.received` все еще имеет значение `false`.
  no_open_feedback: _Развернутые ответы отсутствуют._
  all_received: _Все запрошенные ответы получены._
  score_guidance: >-
    Оцените каждый вопрос от 1 (не согласен) до 5 (полностью согласен).
    Укажите N/A, только если вопрос неприменим.
  questions:
    - id: Q01
      question: Цели, периметр и ожидаемый результат аудита были понятны.
    - id: Q02
      question: Аудит был спланирован и организован так, что необходимое участие было понятно заранее.
    - id: Q03
      question: Коммуникация в ходе аудита была своевременной и эффективной.
    - id: Q04
      question: Внутренний аудит продемонстрировал хорошее понимание бизнес-процесса, рисков и контролей.
    - id: Q05
      question: Запросы информации были понятными, обоснованными и соразмерными целям аудита.
    - id: Q06
      question: При подготовке отчета были должным образом учтены факты, комментарии и ваша позиция.
    - id: Q07
      question: Наблюдения и рекомендации были практичными, реалистичными и способными улучшить процесс или контрольную среду.
    - id: Q08
      question: Аудит был сосредоточен на наиболее значимых областях.
    - id: Q09
      question: При проведении следующего аудита в вашей области вы снова были бы готовы взаимодействовать с внутренним аудитом.
  open_questions:
    - id: O01
      question: Что было наиболее полезным в этом аудите?
    - id: O02
      question: Что внутреннему аудиту следует улучшить в будущих проверках?
    - id: O03
      question: Ожидали ли вы от аудита что-либо, что не было получено?

